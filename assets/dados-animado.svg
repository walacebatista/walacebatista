<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" role="img" aria-label="Animação de consulta SQL e gráfico de dados" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="900" height="260" rx="14" fill="#0d1117" stroke="#30363d"/>

  <!-- janela -->
  <circle cx="26" cy="24" r="5" fill="#484f58"/>
  <circle cx="44" cy="24" r="5" fill="#484f58"/>
  <circle cx="62" cy="24" r="5" fill="#484f58"/>
  <text x="90" y="28" font-family="Fira Code, Consolas, monospace" font-size="12" fill="#6e7681">consulta.sql</text>

  <!-- SQL -->
  <g font-family="Fira Code, Consolas, monospace" font-size="15">
    <text x="40" y="78" fill="#6e7681" opacity="0">-- dados viram decisões
      <animate attributeName="opacity" from="0" to="1" begin="0.3s" dur="0.5s" fill="freeze"/>
    </text>
    <text x="40" y="108" fill="#c9d1d9" opacity="0">SELECT categoria, SUM(valor) AS total
      <animate attributeName="opacity" from="0" to="1" begin="1.2s" dur="0.5s" fill="freeze"/>
    </text>
    <text x="40" y="134" fill="#c9d1d9" opacity="0">FROM vendas
      <animate attributeName="opacity" from="0" to="1" begin="2.0s" dur="0.5s" fill="freeze"/>
    </text>
    <text x="40" y="160" fill="#c9d1d9" opacity="0">WHERE ano = 2026
      <animate attributeName="opacity" from="0" to="1" begin="2.8s" dur="0.5s" fill="freeze"/>
    </text>
    <text x="40" y="186" fill="#c9d1d9" opacity="0">GROUP BY categoria
      <animate attributeName="opacity" from="0" to="1" begin="3.6s" dur="0.5s" fill="freeze"/>
    </text>
    <text x="40" y="212" fill="#c9d1d9" opacity="0">ORDER BY total DESC;
      <animate attributeName="opacity" from="0" to="1" begin="4.4s" dur="0.5s" fill="freeze"/>
    </text>
    <!-- cursor -->
    <rect x="205" y="198" width="9" height="17" fill="#c9d1d9" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="1s" begin="5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- eixo e grade -->
  <g stroke="#30363d" stroke-width="1">
    <line x1="505" y1="220" x2="870" y2="220"/>
    <line x1="505" y1="170" x2="870" y2="170" stroke-dasharray="3 5"/>
    <line x1="505" y1="120" x2="870" y2="120" stroke-dasharray="3 5"/>
    <line x1="505" y1="70" x2="870" y2="70" stroke-dasharray="3 5"/>
  </g>
  <text x="505" y="52" font-family="Fira Code, Consolas, monospace" font-size="12" fill="#6e7681">resultado: total por categoria</text>

  <!-- barras -->
  <g fill="#8b949e">
    <rect x="520" y="140" width="28" height="80" rx="3" opacity="0.55">
      <animate attributeName="height" values="80;105;80" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="y" values="140;115;140" dur="3.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="562" y="110" width="28" height="110" rx="3" opacity="0.6">
      <animate attributeName="height" values="110;85;110" dur="2.8s" repeatCount="indefinite"/>
      <animate attributeName="y" values="110;135;110" dur="2.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="604" y="125" width="28" height="95" rx="3" opacity="0.65">
      <animate attributeName="height" values="95;125;95" dur="3.6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="125;95;125" dur="3.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="646" y="80" width="28" height="140" rx="3" opacity="0.7">
      <animate attributeName="height" values="140;115;140" dur="3s" repeatCount="indefinite"/>
      <animate attributeName="y" values="80;105;80" dur="3s" repeatCount="indefinite"/>
    </rect>
    <rect x="688" y="95" width="28" height="125" rx="3" opacity="0.75">
      <animate attributeName="height" values="125;150;125" dur="3.4s" repeatCount="indefinite"/>
      <animate attributeName="y" values="95;70;95" dur="3.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="730" y="60" width="28" height="160" rx="3" opacity="0.8">
      <animate attributeName="height" values="160;135;160" dur="2.6s" repeatCount="indefinite"/>
      <animate attributeName="y" values="60;85;60" dur="2.6s" repeatCount="indefinite"/>
    </rect>
    <rect x="772" y="75" width="28" height="145" rx="3" opacity="0.85">
      <animate attributeName="height" values="145;170;145" dur="3.8s" repeatCount="indefinite"/>
      <animate attributeName="y" values="75;50;75" dur="3.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="814" y="40" width="28" height="180" rx="3" opacity="0.95">
      <animate attributeName="height" values="180;155;180" dur="3.1s" repeatCount="indefinite"/>
      <animate attributeName="y" values="40;65;40" dur="3.1s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- linha de tendência -->
  <path d="M534 128 L576 98 L618 113 L660 68 L702 83 L744 48 L786 63 L828 28"
        fill="none" stroke="#e6edf3" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
        pathLength="1" stroke-dasharray="1" stroke-dashoffset="1">
    <animate attributeName="stroke-dashoffset" values="1;0;0;1" keyTimes="0;0.5;0.9;1" dur="6s" repeatCount="indefinite"/>
  </path>

  <!-- pontos pulsando -->
  <g fill="#e6edf3">
    <circle cx="534" cy="128" r="3"><animate attributeName="r" values="3;5;3" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="618" cy="113" r="3"><animate attributeName="r" values="3;5;3" dur="2s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="702" cy="83" r="3"><animate attributeName="r" values="3;5;3" dur="2s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="786" cy="63" r="3"><animate attributeName="r" values="3;5;3" dur="2s" begin="1.2s" repeatCount="indefinite"/></circle>
    <circle cx="828" cy="28" r="3"><animate attributeName="r" values="3;5;3" dur="2s" begin="1.6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- legenda dos meses -->
  <g font-family="Fira Code, Consolas, monospace" font-size="11" fill="#6e7681" text-anchor="middle">
    <text x="534" y="238">Jan</text><text x="576" y="238">Fev</text><text x="618" y="238">Mar</text><text x="660" y="238">Abr</text>
    <text x="702" y="238">Mai</text><text x="744" y="238">Jun</text><text x="786" y="238">Jul</text><text x="828" y="238">Ago</text>
  </g>
</svg>
